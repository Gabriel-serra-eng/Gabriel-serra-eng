name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # uma vez por dia, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E21D48&color_dots=#161b22,#4a0f1f,#7a1530,#b0173c,#E21D48
            dist/snake-light.svg?palette=github-light&color_snake=#E21D48&color_dots=#ebedf0,#f7c6d1,#ee8aa1,#e5506f,#C2143E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
