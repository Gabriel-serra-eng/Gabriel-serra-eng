    <circle cx="254" cy="219" r="5" fill="#8C8C8C"/><text x="266" y="224" fill="#B3B3B3">CSS 16,7%</text>
    <circle cx="404" cy="219" r="5" fill="#4A4A4A"/><text x="416" y="224" fill="#B3B3B3">SQL 1,8%</text>
    <circle cx="544" cy="219" r="5" fill="#E6E6E6"/><text x="556" y="224" fill="#B3B3B3">JavaScript 1,0%</text>
