    <text x="1152" y="52" fill="#6E6E6E" font-size="12" text-anchor="end">código próprio dos 3 projetos · medido em 02/11/2026</text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="118" fill="#FFFFFF" font-size="44" font-weight="700">1</text>
