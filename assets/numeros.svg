  <rect width="1200" height="260" rx="18" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="17.5" fill="none" stroke="#242424"/>

  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace">
