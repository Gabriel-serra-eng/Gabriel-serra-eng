    <text x="320" y="118" fill="#FFFFFF" font-size="44" font-weight="700">~7.200</text>
    <text x="320" y="144" fill="#8C8C8C" font-size="15">linhas de TypeScript e CSS</text>

    <text x="620" y="118" fill="#FFFFFF" font-size="44" font-weight="700">2</text>
    <text x="620" y="144" fill="#8C8C8C" font-size="15">migrations SQL com RLS</text>

