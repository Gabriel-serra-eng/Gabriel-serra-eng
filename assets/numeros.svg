    <text x="880" y="144" fill="#8C8C8C" font-size="15">commits com Claude Code</text>
  </g>

  <!-- barra de linguagens: largura útil 1104px a partir de x=48 -->
  <g>
    <rect x="48" y="176" width="890" height="10" fill="#E21D48"/>
    <rect x="938" y="176" width="184" height="10" fill="#8C8C8C"/>
    <rect x="1122" y="176" width="20" height="10" fill="#4A4A4A"/>
    <rect x="1142" y="176" width="10" height="10" fill="#E6E6E6"/>
